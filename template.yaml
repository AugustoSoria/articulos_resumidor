AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Resumidor de articulos con IA - backend + frontend (fase 3)

Parameters:
  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: >-
      ID que se invoca. Es el inference profile cross-region (prefijo "us."),
      la unica forma en que se sirve Haiku 4.5. La forma corta sin fecha ni
      version es la del endpoint Mantle; aca da not_found_error, porque en
      bedrock-runtime el ID viaja en la URL.
  BedrockFoundationModelId:
    Type: String
    Default: "anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: >-
      El mismo modelo, sin el prefijo del perfil. IAM lo necesita por separado:
      el inference profile enruta al foundation model y se evaluan los dos ARNs.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region donde esta habilitado el modelo (puede diferir de la del stack).
  # Sin Default a proposito: no puede vivir en git, ni en este archivo ni en
  # samconfig.toml. Se pasa en cada deploy con --parameter-overrides.
  # NoEcho hace que CloudFormation lo muestre como **** en la consola y en
  # describe-stacks. Ojo: no lo cifra; queda en texto plano en la config de
  # CloudFront y en las variables de entorno de la Lambda.
  SecretoOrigen:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secreto compartido entre CloudFront y el authorizer de la API.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    # API Gateway corta a los 30 s. Un timeout de Lambda mas alto no sirve de
    # nada en un flujo sincrono: el cliente ya recibio el 504.
    Timeout: 29
    # Dimensionado cuando el parser era jsdom: en Lambda la CPU escala con la
    # memoria asignada, asi que bajarla alarga el parseo y puede no ahorrar
    # nada. Con linkedom, que es mucho mas liviano, habria que volver a medir.
    MemorySize: 1024

Resources:
  TablaResumenes:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-resumenes"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Declarada explicitamente y no implicita: la API implicita que genera SAM no
  # admite CorsConfiguration ni RouteSettings.
  ApiResumidor:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      # No hay CorsConfiguration a proposito. El navegador llega a esta API por
      # el behavior /api/* de la misma distribucion de CloudFront que sirve el
      # sitio, asi que para el es el mismo origen: no hay preflight ni cabeceras
      # CORS que negociar. Es la razon por la que la ruta se llama /api/resumir
      # y no /resumir: CloudFront no reescribe rutas, el path tiene que coincidir
      # de punta a punta.
      #
      # Efecto colateral util: el frontend usa una URL relativa, asi que el
      # bundle deja de depender del ambiente en el que se construyo.
      #
      # Limite barato: rechaza en API Gateway, sin invocar la Lambda ni
      # gastar en Bedrock. Los budgets de AWS solo avisan, y con horas de atraso.
      #
      # OJO: esto NO es un techo de gasto. API Gateway aplica el throttling en
      # base a mejor esfuerzo, como objetivo y no como limite garantizado. Con
      # estos valores se probaron 20 requests seguidas y pasaron 18. Frena algo
      # y rechaza antes de invocar nada, asi que queda como primera linea blanda.
      # El techo real tiene que venir de ReservedConcurrentExecutions (ver la
      # funcion) o de un Budget Action. Detalle en el README, "Decisiones".
      #
      # Es un token bucket: el rate es cuantas fichas se reponen por segundo y
      # el burst cuantas entran en el balde, o sea cuanto se tolera de golpe.
      RouteSettings:
        "POST /api/resumir":
          ThrottlingRateLimit: 0.5
          ThrottlingBurstLimit: 2
      # Cierra el acceso directo a execute-api: solo pasan los requests que
      # traen el header que agrega CloudFront. No limita el volumen de uso.
      Auth:
        DefaultAuthorizer: AutorizadorOrigen
        Authorizers:
          AutorizadorOrigen:
            FunctionArn: !GetAtt FuncionAutorizadora.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            # Default false: sin esto API Gateway no puede invocar al
            # authorizer y TODAS las requests fallan con 500, las legitimas
            # incluidas.
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers:
                - x-origen-cloudfront
              # El secreto es constante, asi que todas las requests comparten
              # la misma clave de cache: el authorizer corre una vez cada
              # 5 minutos, no una vez por request.
              ReauthorizeEvery: 300

  FuncionAutorizadora:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: authorizer.handler
      # Compara dos strings: no necesita los 1024 MB ni los 29 s del Global.
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          SECRETO_ORIGEN: !Ref SecretoOrigen
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node22
        Minify: false
        Sourcemap: false
        EntryPoints:
          - src/authorizer.ts

  FuncionResumir:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handler.handler
      # Pendiente: ReservedConcurrentExecutions: 2 seria el otro limite duro,
      # pero hoy haria fallar el deploy. AWS exige dejar 100 unidades de
      # concurrencia sin reservar en la cuenta, y una cuenta nueva tiene cerca
      # de 10 en total. Habilitarlo cuando AWS suba la cuota.
      Environment:
        Variables:
          TABLE_NAME: !Ref TablaResumenes
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
      Policies:
        - Statement:
            # store.ts solo hace PutCommand. DynamoDBCrudPolicy concederia diez
            # acciones, y ademas sobre table/{nombre}/index/*, que no existe.
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt TablaResumenes.Arn
        - Statement:
            # Solo InvokeModel: summarize.ts usa messages.create, no .stream.
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Comodin en la region a proposito: el perfil "us." enruta a
                # us-east-1, us-east-2 y us-west-2, y IAM evalua la region
                # destino. Fijarla da fallos intermitentes.
                - !Sub "arn:aws:bedrock:*::foundation-model/${BedrockFoundationModelId}"
                - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
      Events:
        Resumir:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiResumidor
            Path: /api/resumir
            Method: POST
    Metadata:
      # Este bloque alcanza porque el parser es linkedom. Con jsdom no: hacia
      # falta empaquetar aparte su xhr-sync-worker.js, que jsdom resuelve por
      # ruta en disco al cargar el modulo, y eso exigia BuildMethod: makefile.
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node22
        Minify: false
        Sourcemap: true
        EntryPoints:
          - src/handler.ts

  # --- Frontend: bucket privado detras de un CDN ---

  BucketSitio:
    Type: AWS::S3::Bucket
    Properties:
      # Sin BucketName a proposito: los nombres de bucket son unicos en todo
      # AWS, no solo en la cuenta, asi que fijarlo invita a colisiones y a que
      # el stack no se pueda desplegar dos veces. CloudFormation genera uno.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Reemplaza a la vieja Origin Access Identity. Hace que CloudFront firme cada
  # request al bucket con SigV4, y por eso el bucket puede quedar 100% privado:
  # pedirle un objeto directo a S3 devuelve 403.
  AccesoOrigen:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DistribucionSitio:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} - frontend"
        # Sin esto, entrar al dominio pelado pide el objeto raiz del bucket,
        # que no existe. El navegador nunca pide /index.html explicitamente.
        DefaultRootObject: index.html
        # Solo Norteamerica y Europa: es la clase mas barata y sobra para esto.
        PriceClass: PriceClass_100
        Origins:
          - Id: sitio-s3
            # RegionalDomainName y no DomainName: el global puede redirigir
            # entre endpoints y romper la firma SigV4 del OAC.
            DomainName: !GetAtt BucketSitio.RegionalDomainName
            OriginAccessControlId: !GetAtt AccesoOrigen.Id
            # Vacio a proposito: es el campo de la vieja Origin Access Identity,
            # que el OAC reemplaza, pero CloudFormation lo sigue exigiendo.
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-gateway
            # Solo el host: el path (/api/resumir) lo aporta el request, y
            # CloudFront lo reenvia tal cual porque no reescribe rutas.
            DomainName: !Sub "${ApiResumidor}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            # La pulsera: CloudFront la agrega en el tramo hacia API Gateway,
            # nunca la ve el navegador. Si el viewer manda un header con el
            # mismo nombre, CloudFront lo pisa con este valor.
            OriginCustomHeaders:
              - HeaderName: x-origen-cloudfront
                HeaderValue: !Ref SecretoOrigen
        DefaultCacheBehavior:
          TargetOriginId: sitio-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          # Politica gestionada por AWS: "CachingOptimized".
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Todo lo que empiece con /api/ va a la API en vez de al bucket. Al
        # compartir dominio con el sitio, el navegador lo trata como el mismo
        # origen y CORS deja de existir para este sistema.
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-gateway
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # "CachingDisabled": cada URL produce un resumen distinto, no hay
            # nada que cachear.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # "AllViewerExceptHostHeader". El ExceptHost es lo importante: si
            # CloudFront reenviara el Host del navegador -el dominio de la
            # distribucion- API Gateway no reconoceria la API y rechazaria el
            # request. Necesita ver su propio host.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # S3 responde 403 y no 404 ante un objeto inexistente, porque no le
        # dimos s3:ListBucket: decir "no existe" filtraria que hay en el bucket.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  PermisoLecturaCloudFront:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketSitio
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${BucketSitio.Arn}/*"
            # Sin esta condicion, cualquier distribucion de CloudFront de
            # cualquier cuenta del mundo podria leer el bucket: el principal
            # cloudfront.amazonaws.com es el mismo para todos.
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistribucionSitio}"

Outputs:
  UrlApi:
    Description: >-
      Endpoint POST a traves de CloudFront. El endpoint directo de API Gateway
      sigue existiendo y sigue siendo publico: esto no lo oculta.
    Value: !Sub "https://${DistribucionSitio.DomainName}/api/resumir"
  NombreTabla:
    Value: !Ref TablaResumenes
  UrlSitio:
    Description: URL publica del frontend
    Value: !Sub "https://${DistribucionSitio.DomainName}"
  NombreBucketSitio:
    Description: Bucket donde sincronizar el export de Next (frontend/out/)
    Value: !Ref BucketSitio
